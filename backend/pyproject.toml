[project]
name = "chart-studio-backend"
version = "0.1.0"
description = "Chart Studio API: prompt → Plotly Python over CSVs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "pandas>=2.2",
    "plotly>=5.24",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "supabase>=2.7",
    "sse-starlette>=2.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
